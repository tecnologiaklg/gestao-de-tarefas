name: Deploy to VPS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e

            # 1. Diretório da aplicação na VPS
            APP_DIR="/opt/portal_de_tarefas"
            mkdir -p $APP_DIR

            # 2. Clona ou puxa as atualizações do Git
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Clonando repositório pela primeira vez..."
              git clone https://github.com/${{ github.repository }}.git $APP_DIR
              cd $APP_DIR
            else
              echo "Atualizando repositório existente..."
              cd $APP_DIR
              git fetch --all
              git reset --hard origin/${{ github.ref_name }}
            fi

            # 3. Garante que a rede proxy do Traefik existe
            docker network inspect proxy >/dev/null 2>&1 || docker network create proxy

            # 4. Escreve o arquivo .env a partir do Secret do GitHub
            echo "${{ secrets.ENV_FILE }}" > .env

            # 5. Build e Deploy com Docker Compose (nome do projeto isolado)
            echo "Iniciando build e subida dos containers..."
            docker compose -p portal_tarefas up -d --build --remove-orphans

            # 6. Limpeza de imagens antigas não utilizadas
            docker image prune -f

            echo "Deploy concluído com sucesso!"

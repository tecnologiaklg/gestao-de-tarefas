name: Deploy Gestão de Tarefas

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}

          script: |
            set -e

            APP_DIR="/docker/gestao-tarefas"
            DEPLOY_KEY="/home/appadmin/.ssh/gestao-tarefas_key"

            echo "====================================="
            echo "Deploy Gestão de Tarefas"
            echo "====================================="

            cd "$APP_DIR"

            echo "Atualizando código..."

            GIT_SSH_COMMAND="ssh -i $DEPLOY_KEY -o IdentitiesOnly=yes" \
            git fetch origin main

            GIT_SSH_COMMAND="ssh -i $DEPLOY_KEY -o IdentitiesOnly=yes" \
            git reset --hard origin/main

            echo "Verificando .env..."

            if [ ! -f .env ]; then
              echo "ERRO: .env não encontrado em $APP_DIR"
              exit 1
            fi

            echo "Validando Docker Compose..."
            docker compose config >/dev/null

            echo "Build..."
            docker compose build

            echo "Subindo containers..."
            docker compose up -d --remove-orphans

            echo "Status:"
            docker compose ps

            docker image prune -f

            echo "Deploy concluído com sucesso!"